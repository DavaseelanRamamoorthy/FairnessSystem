  - dialog "Introducing SportFairSystem v1.0 After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage." [ref=e241]:
    - heading "Introducing SportFairSystem v1.0 After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage." [level=2] [ref=e242]:
      - generic [ref=e243]:
        - heading "Introducing SportFairSystem v1.0" [level=4] [ref=e244]
        - paragraph [ref=e245]: After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage.
    - generic [ref=e247]:
      - paragraph [ref=e248]: SportFairSystem started as a simple scorecard parser. Today, it has evolved into a complete, role-aware team system that connects match data, player insights, and team decision-making into one unified platform.
      - generic [ref=e249]:
        - heading "What SportFairSystem v1.0 offers" [level=6] [ref=e250]
        - generic [ref=e251]:
          - paragraph [ref=e252]: Scorecard Ingestion
          - paragraph [ref=e253]: Upload and parse cricket scorecards into structured match data.
        - generic [ref=e254]:
          - paragraph [ref=e255]: Squad & Player Management
          - paragraph [ref=e256]: Build and manage your team with identity-linked player profiles.
        - generic [ref=e257]:
          - paragraph [ref=e258]: Player Intelligence & Analytics
          - paragraph [ref=e259]: Track performance, trends, and usage across matches and seasons.
        - generic [ref=e260]:
          - paragraph [ref=e261]: Planner Workflows
          - paragraph [ref=e262]: Plan matches using attendance data, generate Playing XI, and manage bench decisions.
        - generic [ref=e263]:
          - paragraph [ref=e264]: Validation & Data Integrity
          - paragraph [ref=e265]: Detect missing links, duplicates, and inconsistencies with built-in validation tools.
        - generic [ref=e266]:
          - paragraph [ref=e267]: Authentication & Role-Based Access
          - paragraph [ref=e268]: Secure, role-aware system with admin controls and protected workflows.
      - generic [ref=e269]:
        - heading "Built for Real Teams" [level=6] [ref=e270]
        - paragraph [ref=e271]: SportFairSystem is currently designed as an internal platform for real team workflows, with a focus on simplicity, transparency, and data-driven decisions.
      - generic [ref=e272]:
        - heading "Version 1.0 Scope" [level=6] [ref=e273]
        - paragraph [ref=e274]: This release is intentionally focused and stable. Features like multi-team support, live scoring, and tournament management are planned for future versions.
      - generic [ref=e275]:
        - heading "Why this matters" [level=6] [ref=e276]
        - paragraph [ref=e277]: "Most amateur teams rely on scattered tools or manual tracking. SportFairSystem brings everything together:"
        - paragraph [ref=e279]: Match Data -> Player Insights -> Team Decisions
      - generic [ref=e281]:
        - paragraph [ref=e282]: Responsive Fit Disclaimer
        - paragraph [ref=e283]: SportFairSystem is responsive across desktop, tablet, and mobile, but the best experience is still on desktop or larger tablet screens. A few dense analytics and admin workflows may feel tighter on smaller phones.
      - paragraph [ref=e284]: This is just the beginning. More to come.
