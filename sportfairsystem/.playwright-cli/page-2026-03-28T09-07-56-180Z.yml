  - dialog "Introducing SportFairSystem v1.0 After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage." [ref=e511]:
    - heading "Introducing SportFairSystem v1.0 After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage." [level=2] [ref=e512]:
      - generic [ref=e513]:
        - heading "Introducing SportFairSystem v1.0" [level=4] [ref=e514]
        - paragraph [ref=e515]: After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage.
    - generic [ref=e517]:
      - paragraph [ref=e518]: SportFairSystem started as a simple scorecard parser. Today, it has evolved into a complete, role-aware team system that connects match data, player insights, and team decision-making into one unified platform.
      - generic [ref=e519]:
        - heading "What SportFairSystem v1.0 offers" [level=6] [ref=e520]
        - generic [ref=e521]:
          - paragraph [ref=e522]: Scorecard Ingestion
          - paragraph [ref=e523]: Upload and parse cricket scorecards into structured match data.
        - generic [ref=e524]:
          - paragraph [ref=e525]: Squad & Player Management
          - paragraph [ref=e526]: Build and manage your team with identity-linked player profiles.
        - generic [ref=e527]:
          - paragraph [ref=e528]: Player Intelligence & Analytics
          - paragraph [ref=e529]: Track performance, trends, and usage across matches and seasons.
        - generic [ref=e530]:
          - paragraph [ref=e531]: Planner Workflows
          - paragraph [ref=e532]: Plan matches using attendance data, generate Playing XI, and manage bench decisions.
        - generic [ref=e533]:
          - paragraph [ref=e534]: Validation & Data Integrity
          - paragraph [ref=e535]: Detect missing links, duplicates, and inconsistencies with built-in validation tools.
        - generic [ref=e536]:
          - paragraph [ref=e537]: Authentication & Role-Based Access
          - paragraph [ref=e538]: Secure, role-aware system with admin controls and protected workflows.
      - generic [ref=e539]:
        - heading "Built for Real Teams" [level=6] [ref=e540]
        - paragraph [ref=e541]: SportFairSystem is currently designed as an internal platform for real team workflows, with a focus on simplicity, transparency, and data-driven decisions.
      - generic [ref=e542]:
        - heading "Version 1.0 Scope" [level=6] [ref=e543]
        - paragraph [ref=e544]: This release is intentionally focused and stable. Features like multi-team support, live scoring, and tournament management are planned for future versions.
      - generic [ref=e545]:
        - heading "Why this matters" [level=6] [ref=e546]
        - paragraph [ref=e547]: "Most amateur teams rely on scattered tools or manual tracking. SportFairSystem brings everything together:"
        - paragraph [ref=e549]: Match Data -> Player Insights -> Team Decisions
      - generic [ref=e551]:
        - paragraph [ref=e552]: Responsive Fit Disclaimer
        - paragraph [ref=e553]: SportFairSystem is responsive across desktop, tablet, and mobile, but the best experience is still on desktop or larger tablet screens. A few dense analytics and admin workflows may feel tighter on smaller phones.
      - paragraph [ref=e554]: This is just the beginning. More to come.
