  - dialog "Introducing SportFairSystem v1.0 After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage." [ref=e669]:
    - heading "Introducing SportFairSystem v1.0 After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage." [level=2] [ref=e670]:
      - generic [ref=e671]:
        - heading "Introducing SportFairSystem v1.0" [level=4] [ref=e672]
        - paragraph [ref=e673]: After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage.
    - generic [ref=e675]:
      - paragraph [ref=e676]: SportFairSystem started as a simple scorecard parser. Today, it has evolved into a complete, role-aware team system that connects match data, player insights, and team decision-making into one unified platform.
      - generic [ref=e677]:
        - heading "What SportFairSystem v1.0 offers" [level=6] [ref=e678]
        - generic [ref=e679]:
          - paragraph [ref=e680]: Scorecard Ingestion
          - paragraph [ref=e681]: Upload and parse cricket scorecards into structured match data.
        - generic [ref=e682]:
          - paragraph [ref=e683]: Squad & Player Management
          - paragraph [ref=e684]: Build and manage your team with identity-linked player profiles.
        - generic [ref=e685]:
          - paragraph [ref=e686]: Player Intelligence & Analytics
          - paragraph [ref=e687]: Track performance, trends, and usage across matches and seasons.
        - generic [ref=e688]:
          - paragraph [ref=e689]: Planner Workflows
          - paragraph [ref=e690]: Plan matches using attendance data, generate Playing XI, and manage bench decisions.
        - generic [ref=e691]:
          - paragraph [ref=e692]: Validation & Data Integrity
          - paragraph [ref=e693]: Detect missing links, duplicates, and inconsistencies with built-in validation tools.
        - generic [ref=e694]:
          - paragraph [ref=e695]: Authentication & Role-Based Access
          - paragraph [ref=e696]: Secure, role-aware system with admin controls and protected workflows.
      - generic [ref=e697]:
        - heading "Built for Real Teams" [level=6] [ref=e698]
        - paragraph [ref=e699]: SportFairSystem is currently designed as an internal platform for real team workflows, with a focus on simplicity, transparency, and data-driven decisions.
      - generic [ref=e700]:
        - heading "Version 1.0 Scope" [level=6] [ref=e701]
        - paragraph [ref=e702]: This release is intentionally focused and stable. Features like multi-team support, live scoring, and tournament management are planned for future versions.
      - generic [ref=e703]:
        - heading "Why this matters" [level=6] [ref=e704]
        - paragraph [ref=e705]: "Most amateur teams rely on scattered tools or manual tracking. SportFairSystem brings everything together:"
        - paragraph [ref=e707]: Match Data -> Player Insights -> Team Decisions
      - generic [ref=e709]:
        - paragraph [ref=e710]: Responsive Fit Disclaimer
        - paragraph [ref=e711]: SportFairSystem is responsive across desktop, tablet, and mobile, but the best experience is still on desktop or larger tablet screens. A few dense analytics and admin workflows may feel tighter on smaller phones.
      - paragraph [ref=e712]: This is just the beginning. More to come.
