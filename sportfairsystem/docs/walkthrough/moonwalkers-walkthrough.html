<title>Moonwalkers App Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a flow rail (steps in order) beside a live screen of the app, with notes on what each screen does. */
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --surface-2:#F4F6F8; --line:#DFE3E8;
  --fg:#1C252E; --muted:#637381; --accent:#1877F2; --accent-soft:#D0ECFE; --accent-fg:#0C44AE;
  --ok:#118D57; --ok-soft:#D3FCD2; --warn:#B76E00; --warn-soft:#FFF5CC; --bad:#B71D18; --bad-soft:#FFE9D5;
  --chrome:#1C252E; --chrome-fg:#FFFFFF;
  --display:"Lexend Deca", "Segoe UI", system-ui, sans-serif;
  --body:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --shadow:0 1px 2px rgba(28,37,46,.06), 0 8px 24px rgba(28,37,46,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#111827; --surface-2:#18212F; --line:#2A3546;
  --fg:#E8EDF3; --muted:#919EAB; --accent:#5AA2F8; --accent-soft:#16305A; --accent-fg:#A9D0FD;
  --ok:#5BE49B; --ok-soft:#123B28; --warn:#FFD666; --warn-soft:#3A2E0B; --bad:#FFAC82; --bad-soft:#40180F;
  --chrome:#060B14; --chrome-fg:#E8EDF3; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#111827; --surface-2:#18212F; --line:#2A3546;
  --fg:#E8EDF3; --muted:#919EAB; --accent:#5AA2F8; --accent-soft:#16305A; --accent-fg:#A9D0FD;
  --ok:#5BE49B; --ok-soft:#123B28; --warn:#FFD666; --warn-soft:#3A2E0B; --bad:#FFAC82; --bad-soft:#40180F;
  --chrome:#060B14; --chrome-fg:#E8EDF3; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1480px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
header.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:end;justify-content:space-between;margin-bottom:20px}
header.top h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
.titlerow{display:flex;gap:14px;align-items:center}
.titlerow .logo{width:52px;height:56px;flex:0 0 52px}
header.top p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.roles{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.roles button{font:600 14px var(--body);border:0;background:none;color:var(--muted);padding:8px 14px;border-radius:9px;cursor:pointer}
.roles button[aria-selected="true"]{background:var(--accent);color:#fff}
.roles button:focus-visible,.steps a:focus-visible,.pager button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:2px}
.phase{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px}
.phase:first-child{margin-top:0}
.steps a{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:baseline;padding:7px 10px;border-radius:9px;color:var(--fg);text-decoration:none}
.steps a .n{font:600 12px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.steps a small{display:block;color:var(--muted);font-size:12px}
.steps a:hover{background:var(--surface)}
.steps a[aria-current="page"]{background:var(--surface);box-shadow:var(--shadow)}
.steps a[aria-current="page"] .n{color:var(--accent)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start;min-width:0}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.notes h2{font-size:18px}
.notes .route{font:500 12px ui-monospace,Consolas,monospace;color:var(--accent-fg);background:var(--accent-soft);padding:2px 8px;border-radius:6px;align-self:flex-start}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.notes .lbl{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.notes p{margin:0}
.pager{display:flex;gap:8px;justify-content:space-between}
.pager button{font:600 13px var(--body);border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:8px 12px;border-radius:9px;cursor:pointer;flex:1}
.pager button.next{background:var(--accent);border-color:var(--accent);color:#fff}
.pager button:disabled{opacity:.4;cursor:default}
.sample{font-size:12px;color:var(--muted)}

/* ---------- the app screen, in the v2 look with the club kit ----------
   v2 design: left sidebar, page title bar, navy gradient banner on every page,
   colourful stat tiles, rounded dark cards.
   Kit colours from the 2026 jersey: deep navy shirt, bright red trousers and
   shoulder pattern; orange from the club logo's outline. Red is kept to accents
   so it never reads as a "lost" result. */
.device{
  --app-bg:#F4F5F9; --app-side:#FFFFFF; --app-card:#FFFFFF; --app-card-2:#F3F4F8; --app-line:#E2E4EE;
  --app-fg:#1A1D33; --app-muted:#636A85; --app-active:rgba(38,46,107,.10); --app-active-fg:#262E6B;
  --navy-1:#0B0F2E; --navy-2:#1B2150; --navy-3:#2A3275; --mark:#D7192D;
  --kit-red:#D7192D; --logo-orange:#F5A31A;
  --t-blue-1:#141A45; --t-blue-2:#262E6B; --t-blue-3:#4A56A8;
  --t-green-1:#118D57; --t-green-2:#22C55E; --t-green-3:#77ED8B;
  --t-orange-1:#B96A00; --t-orange-2:#F5A31A; --t-orange-3:#FFD27A;
  --t-purple-1:#8E0E1C; --t-purple-2:#D7192D; --t-purple-3:#F2545F;
  --surface:var(--app-card); --surface-2:var(--app-card-2); --line:var(--app-line); --fg:var(--app-fg); --muted:var(--app-muted);
  background:var(--app-bg);color:var(--app-fg);border:1px solid var(--app-line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);min-width:0;container-type:inline-size}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .device{
  --app-bg:#0C0F22; --app-side:#10142C; --app-card:#151A36; --app-card-2:#1B2142; --app-line:#272E55;
  --app-fg:#E9EAF3; --app-muted:#9A9FBC; --app-active:rgba(74,86,168,.30); --app-active-fg:#FFFFFF}}
:root[data-theme="dark"] .device{
  --app-bg:#0C0F22; --app-side:#10142C; --app-card:#151A36; --app-card-2:#1B2142; --app-line:#272E55;
  --app-fg:#E9EAF3; --app-muted:#9A9FBC; --app-active:rgba(74,86,168,.30); --app-active-fg:#FFFFFF}
.logo{display:block;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.side .brandrow{display:flex;align-items:center;gap:9px}
.side .brandrow .logo{width:38px;height:42px}
.hero{border-bottom:3px solid var(--kit-red)}
.hero .hlogo{width:64px;height:70px;flex:0 0 auto;position:relative;z-index:1}
.authcard .hero{border-bottom:3px solid var(--kit-red)}
.authcard .hero .ht{display:flex;flex-direction:column}
.shell{display:grid;grid-template-columns:168px minmax(0,1fr);min-height:520px}
.side{background:var(--app-side);border-right:1px solid var(--app-line);display:flex;flex-direction:column;gap:14px;padding:16px 10px}
.side .ts small{display:block;font:700 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--app-muted)}
.side .ts b{font:700 15px var(--display)}
.side nav em,.bottomnav em{font-style:normal}
.side nav{display:flex;flex-direction:column;gap:2px;flex:1}
.side nav span{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;padding:8px 10px;border-radius:10px;color:var(--app-muted);position:relative}
.side nav span.on{background:var(--app-active);color:var(--app-active-fg)}
.side nav span.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--mark)}
.ico{width:17px;height:17px;flex:0 0 17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.side .me{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;border-top:1px solid var(--app-line);padding-top:12px}
.side .me .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--navy-3),var(--kit-red));color:#fff;display:grid;place-items:center;font-size:12px;flex:0 0 26px}
.side .me small{display:block;font-weight:500;color:var(--app-muted)}
.mainc{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--app-line)}
.topbar .burger{width:30px;height:30px;border-radius:50%;background:var(--app-card-2);display:grid;place-items:center;flex:0 0 30px;color:var(--app-muted)}
.topbar h3{font:700 19px var(--display);line-height:1.2}
.topbar small{display:block;color:var(--app-muted);font-size:12px}
.page{padding:20px;display:flex;flex-direction:column;gap:16px;min-height:420px}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:18px 22px 20px;color:#fff;background:linear-gradient(135deg,var(--navy-1) 0%,var(--navy-2) 58%,var(--navy-3) 100%);border:1px solid rgba(120,130,210,.22);display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between}
.hero .eb{font:700 10px var(--body);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.hero h3{font:700 26px var(--display);line-height:1.15;margin:4px 0 2px;color:#fff}
.hero p{margin:0;color:rgba(255,255,255,.78);font-size:13px;max-width:52ch}
.hero .ht{position:relative;z-index:1;min-width:0;flex:1 1 260px}
.hero .hr{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero .deco{position:absolute;right:0;top:0;width:60%;height:100%;pointer-events:none}
.hero .deco path{stroke:rgba(215,25,45,.75);stroke-width:1.3}
.hero .deco path.k{stroke:none;fill:rgba(215,25,45,.22)}
.hero .deco path.f{stroke:rgba(255,255,255,.16)}
.htog{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px;font-size:12px;font-weight:600}
.htog span{padding:5px 10px;border-radius:8px;color:rgba(255,255,255,.7)}
.htog span.on{background:rgba(255,255,255,.16);color:#fff}
.hsel{border:1px solid rgba(255,255,255,.22);border-radius:9px;padding:3px 10px 5px;min-width:130px;background:rgba(6,18,48,.35)}
.hsel small{display:block;font-size:10px;color:rgba(255,255,255,.65)}
.hsel b{font-size:13px;font-weight:600}
.hsel b::after{content:"▾";float:right;margin-left:10px;color:rgba(255,255,255,.65)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{border-radius:16px;overflow:hidden;background:var(--app-card);border:1px solid var(--app-line);display:flex;flex-direction:column}
.kpi .top{position:relative;padding:12px 14px 14px;color:#fff;display:flex;flex-direction:column;gap:6px}
.kpi .top::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(255,255,255,.16),transparent 32%);pointer-events:none}
.kpi .lab{display:flex;align-items:center;gap:8px;font:700 10px var(--body);letter-spacing:.08em;text-transform:uppercase}
.kpi .lab i{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-style:normal}
.kpi .lab .ico{width:13px;height:13px;flex-basis:13px}
.kpi .val{font:700 24px var(--display);text-align:center;line-height:1.15;overflow-wrap:anywhere}
.kpi .cap{font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;text-align:center;color:var(--app-muted);padding:7px 8px}
.kpi.blue .top{background:linear-gradient(135deg,var(--t-blue-1),var(--t-blue-2) 55%,var(--t-blue-3))}
.kpi.green .top{background:linear-gradient(135deg,var(--t-green-1),var(--t-green-2) 55%,var(--t-green-3))}
.kpi.orange .top{background:linear-gradient(135deg,var(--t-orange-1),var(--t-orange-2) 55%,var(--t-orange-3))}
.kpi.purple .top{background:linear-gradient(135deg,var(--t-purple-1),var(--t-purple-2) 55%,var(--t-purple-3))}
.stat{background:var(--app-card);border:1px solid var(--app-line);border-radius:14px;padding:12px 14px}
.stat small{display:block;font-size:12px;color:var(--app-muted)}
.stat b{display:block;font:700 22px var(--display);margin:2px 0}
.auth{min-height:520px;display:grid;place-items:center;padding:28px 16px;background:radial-gradient(circle at 20% 0%,#2A3275 0%,transparent 55%),radial-gradient(circle at 100% 100%,rgba(215,25,45,.25) 0%,transparent 40%),linear-gradient(160deg,#0B0F2E,#1B2150)}
.authcard{width:min(460px,100%);border-radius:22px;overflow:hidden;background:var(--app-card);border:1px solid rgba(120,130,210,.25);box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column}
.authcard .hero{border-radius:0;border:0}
.authcard .body{padding:18px;display:flex;flex-direction:column;gap:14px}
.authcard .body > .card{border:0;padding:0;background:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card .ch h4{font:600 16px var(--display);margin:0}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > *{flex:1 1 180px;min-width:0}
.f{border:1px solid var(--line);border-radius:8px;padding:6px 10px 7px;background:var(--surface);position:relative;min-width:0}
.f label{display:block;font-size:11px;color:var(--muted);font-weight:600}
.f .v{font-size:14px;min-height:20px;overflow-wrap:anywhere}
.f .v.ph{color:var(--muted)}
.f.sel .v::after{content:"▾";float:right;color:var(--muted)}
.f.err{border-color:var(--bad)}
.help{font-size:12px;color:var(--muted);margin-top:-6px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.b{font:600 13px var(--body);border-radius:8px;padding:7px 14px;border:1px solid transparent;display:inline-block}
.b.c{background:linear-gradient(135deg,var(--navy-2),var(--navy-3));color:#fff;border-color:rgba(120,130,210,.35);box-shadow:0 4px 14px rgba(27,33,80,.35)}
.b.o{border-color:var(--line);color:var(--fg);background:var(--surface)}
.b.t{color:var(--accent);padding-inline:6px}
.b.d{background:var(--bad-soft);color:var(--bad)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:none;color:var(--ok);border-color:currentColor}
.chip.warn{background:none;color:var(--warn);border-color:currentColor}
.chip.bad{background:none;color:var(--bad);border-color:currentColor}
.chip.info{background:none;color:var(--accent);border-color:currentColor}
.chip.win{background:#22C55E;color:#fff;border-color:transparent}
.chip.loss{background:#E53935;color:#fff;border-color:transparent}
.alert{border-radius:10px;padding:10px 14px;font-size:13px}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--accent-soft);color:var(--accent-fg)}
.tbl{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs span{padding:8px 12px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs span.on{color:var(--accent);border-color:var(--accent)}
.bal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bal div{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.bal small{display:block;color:var(--muted);font-size:12px}
.bal b{font:600 20px var(--display)}
.bal .owed{color:var(--ok)} .bal .ahead{color:var(--warn)}
.pos{color:var(--ok);font-weight:600} .neg{color:var(--warn);font-weight:600}
.namerow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check i{flex:0 0 16px;height:16px;border-radius:4px;border:2px solid var(--accent);background:var(--accent);margin-top:2px}
.check i.off{background:none;border-color:var(--muted)}
.big{font:600 17px var(--display)}
.muted{color:var(--muted)}
.dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;max-width:420px}
.bottomnav{display:none}

@media (max-width:980px){
  .grid{grid-template-columns:1fr}
  .steps{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .phase{display:none}
  .steps a{flex:0 0 auto;grid-template-columns:auto auto;background:var(--surface);border:1px solid var(--line)}
  .steps a small{display:none}
  .stage{grid-template-columns:1fr}
}
/* Narrow device: sidebar shrinks to icons, then becomes v2's bottom navigation. */
@container (max-width:760px){
  .shell{grid-template-columns:60px minmax(0,1fr)}
  .side{padding:16px 8px;align-items:center}
  .side .ts,.side nav span em,.side .me span{display:none}
  .side nav span{justify-content:center;padding:9px}
  .side nav span.on::before{left:-8px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .val{font-size:20px}
}
@container (max-width:540px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .bottomnav{display:flex;justify-content:space-around;border-top:1px solid var(--app-line);background:var(--app-side);padding:8px 4px;font-size:10px;font-weight:600;color:var(--app-muted)}
  .bottomnav span{display:flex;flex-direction:column;align-items:center;gap:2px}
  .bottomnav span.on{color:var(--app-active-fg)}
  .bottomnav span.on .ico{color:var(--kit-red)}
  .topbar{padding:12px 14px}
  .page{padding:14px}
  .hero{padding:16px}
  .hero h3{font-size:22px}
  .namerow{grid-template-columns:1fr}
  .bal b{font-size:17px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .val{font-size:19px}
}
@media (prefers-reduced-motion:no-preference){.page{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="titlerow">
      <img id="toplogo" class="logo" alt="Moonwalkers logo" width="52" height="56">
      <div>
      <h1>Moonwalkers app, screen by screen</h1>
      <p>Every page of the v3 app in the order people use it, drawn in the v2 look with the club's kit colours and logo. Players and numbers are made-up test data.</p>
      </div>
    </div>
    <div class="roles" role="tablist" aria-label="Whose flow">
      <button role="tab" id="role-admin" data-role="admin" aria-selected="true">Organiser &amp; captains</button>
      <button role="tab" id="role-player" data-role="player" aria-selected="false">Players</button>
    </div>
  </header>
  <div class="grid">
    <nav class="steps" id="steps" aria-label="Screens"></nav>
    <div class="stage">
      <div class="device" id="device"></div>
      <aside class="notes" id="notes"></aside>
    </div>
  </div>
</div>

const row=(...x)=>`<div class="row">${x.map(i=>`<div>${i}</div>`).join("")}</div>`;

const tabs=(l,on)=>`<div class="tabs">${l.map(x=>`<span class="${x===on?"on":""}">${x}</span>`).join("")}</div>`;
const check=(t,on=true)=>`<div class="check"><i class="${on?"":"off"}"></i><span>${t}</span></div>`;

function dashboard(){
  const seasons=[[2024,22,6,16,0],[2025,65,25,37,2],[2026,25,8,15,1]];
  const max=Math.max(...seasons.map(s=>s[1]));
  const bars=seasons.map(([y,p,w,l,t])=>`<div style="display:grid;grid-template-columns:42px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:12px"><span class="muted">${y}</span><div style="display:flex;gap:2px;height:16px;width:${p/max*100}%">${[[w,"var(--accent)"],[l,"#eb6834"],[t,"#1baf7a"]].filter(x=>x[0]).map(([n,c])=>`<span title="${n}" style="flex:${n};background:${c};border-radius:3px"></span>`).join("")}</div><span style="text-align:right">${p}</span></div>`).join("");
  return title("Team Dashboard","Results, leaders and head-to-head from every imported CricHeroes scorecard, 2024–2026.",hsel("Season","All seasons"))
   +kpis(kpi("blue","Fixtures","Matches played","112","+1 abandoned"),kpi("green","trend","Win ratio","35%","39 won · 68 lost · 3 tied"),kpi("orange","trophy","Top run scorer","Arun Kumar","1,149 runs"),kpi("purple","ball","Top wicket taker","Gopal Nair","93 wickets"))
   +card("Results by season",`<div style="display:flex;flex-direction:column;gap:8px">${bars}</div><div class="muted" style="font-size:12px;display:flex;gap:14px"><span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent)"></span> Won</span><span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#eb6834"></span> Lost</span><span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#1baf7a"></span> Tied</span></div>`+tbl(["Season","Played","Won","Lost","Win rate"],seasons.map(([y,p,w,l])=>[y,p,w,l,Math.round(w/p*100)+"%"])))
   +`<div class="row">`
   +`<div>${card("Most runs",tbl(["Player","Runs","Best"],[["Arun Kumar","1149","55"],["Faiz Rahman","735","46"],["Dev Patel","662","60"],["Bilal Shah","538","37"]]))}</div>`
   +`<div>${card("Most wickets",tbl(["Player","Wkts","Overs"],[["Gopal Nair","93","169.5"],["Faiz Rahman","83","131.2"],["Arun Kumar","59","116.0"],["Bilal Shah","59","106.5"]]))}</div>`
   +`</div><div class="row">`
   +`<div>${card("Best economy (20+ overs)",tbl(["Player","Econ","Wkts"],[["Dev Patel","6.57","25"],["Faiz Rahman","6.85","83"],["Eli Moss","6.87","41"]]))}</div>`
   +`<div>${card("Against each opponent",tbl(["Opponent","P","W","L"],[["Rivals CC","16","8","7"],["Bonn Strikers","12","7","5"],["Köln Kings","9","0","9"]]))}</div>`
   +`</div>`
   +card("Latest results",`<div>${chip("Won","win")} vs Rivals CC · Sun 4 Oct · won by 25 runs</div><div>${chip("Lost","loss")} vs Rivals CC · Sun 4 Oct · lost by 13 runs</div><div>${chip("Won","win")} vs Bonn Strikers · Sun 31 May · won by 3 wickets</div>`);
}

let role="admin", idx=0;
const $=id=>document.getElementById(id);
function renderSteps(){
  const list=FLOWS[role]; let html="", last="";
  list.forEach((st,i)=>{ if(st.phase!==last){html+=`<div class="phase">${st.phase}</div>`; last=st.phase;}
    html+=`<a href="#${st.id}" ${i===idx?'aria-current="page"':""}><span class="n">${String(i+1).padStart(2,"0")}</span><span>${st.name}<small>${st.short}</small></span></a>`;});
  $("steps").innerHTML=html;
}
function renderScreen(){
  const st=FLOWS[role][idx]; const navList=role==="admin"?ADMIN_NAV:PLAYER_NAV;
  if(!st.nav){
    // Signed-out and one-off screens use v2's centred sign-in card.
    EYEBROW="Moonwalkers";
    $("device").innerHTML=`<div class="auth"><div class="authcard">${st.body().replace(/(<\/section>)/,"$1<div class=\"body\">")}</div></div></div>`;
  } else {
    const [top,sub,eb]=NAV_INFO[st.nav]; EYEBROW=eb;
    const me=role==="admin"?["O","Olga","Organiser"]:["D","Dev","Player"];
    const side=`<aside class="side"><div class="brandrow">${logo()}<div class="ts"><small>Team space</small><b>Moonwalkers</b></div></div><nav>${navList.map(n=>`<span class="${n===st.nav?"on":""}">${ico(n)}<em>${n}</em></span>`).join("")}</nav><div class="me"><i class="av" style="font-style:normal">${me[0]}</i><span>${me[1]}<small>${me[2]}</small></span></div></aside>`;
    const bottom=`<div class="bottomnav">${navList.map(n=>`<span class="${n===st.nav?"on":""}">${ico(n)}<em>${n}</em></span>`).join("")}</div>`;
    $("device").innerHTML=`<div class="shell">${side}<div class="mainc"><div class="topbar"><span class="burger">${'<svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>'}</span><div><h3>${top}</h3><small>${sub}</small></div></div><div class="page">${st.body()}</div></div></div>${bottom}`;
  }
  const list=FLOWS[role];
  $("notes").innerHTML=`<span class="route">${st.route}</span><h2>${String(idx+1).padStart(2,"0")} · ${st.name}</h2><div><div class="lbl">What happens here</div><ul>${st.does.map(d=>`<li>${d}</li>`).join("")}</ul></div><div><div class="lbl">Who uses it</div><p>${st.who}</p></div><div class="pager"><button id="prev" ${idx===0?"disabled":""}>← Back</button><button id="next" class="next" ${idx===list.length-1?"disabled":""}>Next →</button></div><p class="sample">Sample data: made-up players, not your real squad.</p>`;
  $("prev").onclick=()=>go(idx-1); $("next").onclick=()=>go(idx+1);
}
function setRole(r){ role=r; document.querySelectorAll(".roles button").forEach(x=>x.setAttribute("aria-selected",String(x.dataset.role===r))); }
function go(i){ const st=FLOWS[role][i]; if(st) location.hash=st.id; }
function fromHash(){
  const h=location.hash.slice(1);
  for(const r of ["admin","player"]){ const i=FLOWS[r].findIndex(s=>s.id===h); if(i>=0){setRole(r); idx=i; break;} }
  renderSteps(); renderScreen();
}
document.querySelectorAll(".roles button").forEach(x=>x.onclick=()=>{ setRole(x.dataset.role); idx=0; location.hash=FLOWS[role][0].id; renderSteps(); renderScreen(); });
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
