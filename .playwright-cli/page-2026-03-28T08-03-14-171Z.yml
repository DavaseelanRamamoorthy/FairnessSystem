  - dialog "Introducing SportFairSystem v1.0 After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage." [ref=e661]:
    - heading "Introducing SportFairSystem v1.0 After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage." [level=2] [ref=e662]:
      - generic [ref=e663]:
        - heading "Introducing SportFairSystem v1.0" [level=4] [ref=e664]
        - paragraph [ref=e665]: After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage.
    - generic [ref=e667]:
      - paragraph [ref=e668]: SportFairSystem started as a simple scorecard parser. Today, it has evolved into a complete, role-aware team system that connects match data, player insights, and team decision-making into one unified platform.
      - generic [ref=e669]:
        - heading "What SportFairSystem v1.0 offers" [level=6] [ref=e670]
        - generic [ref=e671]:
          - paragraph [ref=e672]: Scorecard Ingestion
          - paragraph [ref=e673]: Upload and parse cricket scorecards into structured match data.
        - generic [ref=e674]:
          - paragraph [ref=e675]: Squad & Player Management
          - paragraph [ref=e676]: Build and manage your team with identity-linked player profiles.
        - generic [ref=e677]:
          - paragraph [ref=e678]: Player Intelligence & Analytics
          - paragraph [ref=e679]: Track performance, trends, and usage across matches and seasons.
        - generic [ref=e680]:
          - paragraph [ref=e681]: Planner Workflows
          - paragraph [ref=e682]: Plan matches using attendance data, generate Playing XI, and manage bench decisions.
        - generic [ref=e683]:
          - paragraph [ref=e684]: Validation & Data Integrity
          - paragraph [ref=e685]: Detect missing links, duplicates, and inconsistencies with built-in validation tools.
        - generic [ref=e686]:
          - paragraph [ref=e687]: Authentication & Role-Based Access
          - paragraph [ref=e688]: Secure, role-aware system with admin controls and protected workflows.
      - generic [ref=e689]:
        - heading "Built for Real Teams" [level=6] [ref=e690]
        - paragraph [ref=e691]: SportFairSystem is currently designed as an internal platform for real team workflows, with a focus on simplicity, transparency, and data-driven decisions.
      - generic [ref=e692]:
        - heading "Version 1.0 Scope" [level=6] [ref=e693]
        - paragraph [ref=e694]: This release is intentionally focused and stable. Features like multi-team support, live scoring, and tournament management are planned for future versions.
      - generic [ref=e695]:
        - heading "Why this matters" [level=6] [ref=e696]
        - paragraph [ref=e697]: "Most amateur teams rely on scattered tools or manual tracking. SportFairSystem brings everything together:"
        - paragraph [ref=e699]: Match Data -> Player Insights -> Team Decisions
      - generic [ref=e701]:
        - paragraph [ref=e702]: Responsive Fit Disclaimer
        - paragraph [ref=e703]: SportFairSystem is responsive across desktop, tablet, and mobile, but the best experience is still on desktop or larger tablet screens. A few dense analytics and admin workflows may feel tighter on smaller phones.
      - paragraph [ref=e704]: This is just the beginning. More to come.
