  - dialog "Introducing SportFairSystem v1.0 After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage." [ref=e233]:
    - heading "Introducing SportFairSystem v1.0 After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage." [level=2] [ref=e234]:
      - generic [ref=e235]:
        - heading "Introducing SportFairSystem v1.0" [level=4] [ref=e236]
        - paragraph [ref=e237]: After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage.
    - generic [ref=e239]:
      - paragraph [ref=e240]: SportFairSystem started as a simple scorecard parser. Today, it has evolved into a complete, role-aware team system that connects match data, player insights, and team decision-making into one unified platform.
      - generic [ref=e241]:
        - heading "What SportFairSystem v1.0 offers" [level=6] [ref=e242]
        - generic [ref=e243]:
          - paragraph [ref=e244]: Scorecard Ingestion
          - paragraph [ref=e245]: Upload and parse cricket scorecards into structured match data.
        - generic [ref=e246]:
          - paragraph [ref=e247]: Squad & Player Management
          - paragraph [ref=e248]: Build and manage your team with identity-linked player profiles.
        - generic [ref=e249]:
          - paragraph [ref=e250]: Player Intelligence & Analytics
          - paragraph [ref=e251]: Track performance, trends, and usage across matches and seasons.
        - generic [ref=e252]:
          - paragraph [ref=e253]: Planner Workflows
          - paragraph [ref=e254]: Plan matches using attendance data, generate Playing XI, and manage bench decisions.
        - generic [ref=e255]:
          - paragraph [ref=e256]: Validation & Data Integrity
          - paragraph [ref=e257]: Detect missing links, duplicates, and inconsistencies with built-in validation tools.
        - generic [ref=e258]:
          - paragraph [ref=e259]: Authentication & Role-Based Access
          - paragraph [ref=e260]: Secure, role-aware system with admin controls and protected workflows.
      - generic [ref=e261]:
        - heading "Built for Real Teams" [level=6] [ref=e262]
        - paragraph [ref=e263]: SportFairSystem is currently designed as an internal platform for real team workflows, with a focus on simplicity, transparency, and data-driven decisions.
      - generic [ref=e264]:
        - heading "Version 1.0 Scope" [level=6] [ref=e265]
        - paragraph [ref=e266]: This release is intentionally focused and stable. Features like multi-team support, live scoring, and tournament management are planned for future versions.
      - generic [ref=e267]:
        - heading "Why this matters" [level=6] [ref=e268]
        - paragraph [ref=e269]: "Most amateur teams rely on scattered tools or manual tracking. SportFairSystem brings everything together:"
        - paragraph [ref=e271]: Match Data -> Player Insights -> Team Decisions
      - generic [ref=e273]:
        - paragraph [ref=e274]: Responsive Fit Disclaimer
        - paragraph [ref=e275]: SportFairSystem is responsive across desktop, tablet, and mobile, but the best experience is still on desktop or larger tablet screens. A few dense analytics and admin workflows may feel tighter on smaller phones.
      - paragraph [ref=e276]: This is just the beginning. More to come.
