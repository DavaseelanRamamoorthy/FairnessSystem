  - dialog "Introducing SportFairSystem v1.0 After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage." [ref=e204]:
    - heading "Introducing SportFairSystem v1.0 After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage." [level=2] [ref=e205]:
      - generic [ref=e206]:
        - heading "Introducing SportFairSystem v1.0" [level=4] [ref=e207]
        - paragraph [ref=e208]: After months of building, refining, and real-world validation, SportFairSystem v1.0 is live, stable, and ready for real usage.
    - generic [ref=e210]:
      - paragraph [ref=e211]: SportFairSystem started as a simple scorecard parser. Today, it has evolved into a complete, role-aware team system that connects match data, player insights, and team decision-making into one unified platform.
      - generic [ref=e212]:
        - heading "What SportFairSystem v1.0 offers" [level=6] [ref=e213]
        - generic [ref=e214]:
          - paragraph [ref=e215]: Scorecard Ingestion
          - paragraph [ref=e216]: Upload and parse cricket scorecards into structured match data.
        - generic [ref=e217]:
          - paragraph [ref=e218]: Squad & Player Management
          - paragraph [ref=e219]: Build and manage your team with identity-linked player profiles.
        - generic [ref=e220]:
          - paragraph [ref=e221]: Player Intelligence & Analytics
          - paragraph [ref=e222]: Track performance, trends, and usage across matches and seasons.
        - generic [ref=e223]:
          - paragraph [ref=e224]: Planner Workflows
          - paragraph [ref=e225]: Plan matches using attendance data, generate Playing XI, and manage bench decisions.
        - generic [ref=e226]:
          - paragraph [ref=e227]: Validation & Data Integrity
          - paragraph [ref=e228]: Detect missing links, duplicates, and inconsistencies with built-in validation tools.
        - generic [ref=e229]:
          - paragraph [ref=e230]: Authentication & Role-Based Access
          - paragraph [ref=e231]: Secure, role-aware system with admin controls and protected workflows.
      - generic [ref=e232]:
        - heading "Built for Real Teams" [level=6] [ref=e233]
        - paragraph [ref=e234]: SportFairSystem is currently designed as an internal platform for real team workflows, with a focus on simplicity, transparency, and data-driven decisions.
      - generic [ref=e235]:
        - heading "Version 1.0 Scope" [level=6] [ref=e236]
        - paragraph [ref=e237]: This release is intentionally focused and stable. Features like multi-team support, live scoring, and tournament management are planned for future versions.
      - generic [ref=e238]:
        - heading "Why this matters" [level=6] [ref=e239]
        - paragraph [ref=e240]: "Most amateur teams rely on scattered tools or manual tracking. SportFairSystem brings everything together:"
        - paragraph [ref=e242]: Match Data -> Player Insights -> Team Decisions
      - generic [ref=e244]:
        - paragraph [ref=e245]: Responsive Fit Disclaimer
        - paragraph [ref=e246]: SportFairSystem is responsive across desktop, tablet, and mobile, but the best experience is still on desktop or larger tablet screens. A few dense analytics and admin workflows may feel tighter on smaller phones.
      - paragraph [ref=e247]: This is just the beginning. More to come.
